<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRISHUL Enterprise — Security Operations Authentication</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    :root {
      --bg-canvas: #090c15;
      --surface-1: #0f1523;
      --surface-2: #141c2e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-bright: rgba(255, 255, 255, 0.16);
      --accent-cyan: #38bdf8;
    }
    body {
      background-color: var(--bg-canvas);
      color: #f1f5f9;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background-color: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-top: 1px solid var(--border-bright);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      border-radius: 8px;
    }
    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2) 0%, rgba(37, 99, 235, 0.2) 100%);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent-cyan);
    }
    .form-control {
      background-color: var(--surface-2) !important;
      border: 1px solid var(--border-subtle) !important;
      color: #f1f5f9 !important;
      font-size: 0.84rem;
    }
    .form-control:focus {
      border-color: var(--accent-cyan) !important;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15) !important;
    }
    .input-group-text {
      background-color: var(--surface-2) !important;
      border: 1px solid var(--border-subtle) !important;
      color: #94a3b8;
    }
    .pulse-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      background-color: #10b981;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse-ring 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
      70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>

<div class="login-card p-4 p-md-4">
  <!-- Brand Header -->
  <div class="text-center mb-4">
    <div class="brand-mark mb-2.5">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v20M12 22l-4-4M12 22l4-4M5 7v5a7 7 0 0 0 14 0V7M5 7L2 5M19 7l3-2"/>
      </svg>
    </div>
    <h4 class="fw-bold mb-0 text-light font-mono" style="letter-spacing: 0.08em;">TRISHUL</h4>
    <div class="text-muted small" style="font-size: 0.72rem; letter-spacing: 0.08em;">DEFENSE FABRIC &middot; XDR // SIEM</div>
    <div class="mt-2">
      <span class="badge font-mono border border-success border-opacity-30 text-success" style="background: rgba(16, 185, 129, 0.06); font-size: 0.68rem;">
        <span class="pulse-dot"></span> SECURE INGESTION GATEWAY ONLINE
      </span>
    </div>
  </div>

  <!-- Flash Error Message -->
  {% if error %}
  <div class="alert alert-danger py-2 px-3 small border border-danger border-opacity-30 mb-3 d-flex align-items-center gap-2" style="background: rgba(239, 68, 68, 0.1);">
    <i class="bi bi-exclamation-triangle-fill text-danger"></i>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <!-- Login Form -->
  <form method="POST" action="/login">
    <input type="hidden" name="next" value="{{ next_url or '' }}">
    
    <div class="mb-3">
      <label class="form-label small text-muted text-uppercase fw-semibold" style="font-size: 0.68rem; letter-spacing: 0.06em;">Analyst Identity / Username</label>
      <div class="input-group input-group-sm">
        <span class="input-group-text"><i class="bi bi-person"></i></span>
        <input type="text" id="username" name="username" class="form-control font-mono" placeholder="admin / analyst" required autofocus>
      </div>
    </div>

    <div class="mb-3.5">
      <label class="form-label small text-muted text-uppercase fw-semibold" style="font-size: 0.68rem; letter-spacing: 0.06em;">Password</label>
      <div class="input-group input-group-sm">
        <span class="input-group-text"><i class="bi bi-key"></i></span>
        <input type="password" id="password" name="password" class="form-control font-mono" placeholder="••••••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn btn-info w-100 py-1.5 fw-semibold text-dark mb-3 font-mono" style="font-size: 0.82rem;">
      <i class="bi bi-shield-check me-1"></i> Authenticate &amp; Initialize Console
    </button>
  </form>

  <!-- Quick Demo Fill Buttons -->
  <div class="p-2.5 rounded border small" style="background: rgba(0,0,0,0.3); border-color: var(--border-subtle) !important;">
    <div class="text-muted fw-semibold mb-2 font-mono" style="font-size: 0.68rem; letter-spacing: 0.04em;">DEMO CREDENTIAL PROFILES:</div>
    <div class="d-flex gap-1.5">
      <button type="button" class="btn btn-xs btn-outline-info flex-grow-1 py-1 font-mono" style="font-size: 0.7rem;" onclick="quickFill('admin', 'minisoc@admin')">
        admin
      </button>
      <button type="button" class="btn btn-xs btn-outline-secondary flex-grow-1 py-1 font-mono text-light" style="font-size: 0.7rem;" onclick="quickFill('analyst', 'minisoc@analyst')">
        analyst
      </button>
      <button type="button" class="btn btn-xs btn-outline-primary flex-grow-1 py-1 font-mono text-info" style="font-size: 0.7rem;" onclick="quickFill('rites', 'password123')">
        rites
      </button>
    </div>
  </div>

  <div class="text-center text-muted font-mono mt-3" style="font-size: 0.66rem;">
    SHA-256 Auth &bull; RBAC Policy Enforcement &bull; NIST SP 800-61
  </div>
</div>

<script>
function quickFill(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
}
</script>
</body>
</html>
