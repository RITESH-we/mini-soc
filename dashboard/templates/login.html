<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniSOC v2.2 — Security Operations Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #080c14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
      border-radius: 12px;
    }
    .brand-glow {
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }
    .form-control:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.25);
    }
    .pulse-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: #10b981;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse-ring 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
  </style>
</head>
<body>

<div class="login-card p-4 p-md-5">
  <!-- Brand Header -->
  <div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center bg-dark border border-info rounded-circle mb-3" style="width: 64px; height: 64px;">
      <span class="fs-2 text-info">🛡️</span>
    </div>
    <h3 class="fw-bold mb-1 brand-glow text-info">MiniSOC Console</h3>
    <div class="small text-muted">Cloud-Ready SIEM, XDR &amp; UEBA Platform</div>
    <div class="mt-2">
      <span class="badge bg-dark border border-success text-success small">
        <span class="pulse-dot"></span> Real-Time Security Gateway Online
      </span>
    </div>
  </div>

  <!-- Flash Error Message -->
  {% if error %}
  <div class="alert alert-danger py-2 px-3 small border-0 mb-3 d-flex align-items-center gap-2">
    <span>⚠️</span>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <!-- Login Form -->
  <form method="POST" action="/login">
    <input type="hidden" name="next" value="{{ next_url or '' }}">
    
    <div class="mb-3">
      <label class="form-label small text-muted text-uppercase fw-bold">User ID / Username</label>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary text-muted">👤</span>
        <input type="text" id="username" name="username" class="form-control bg-dark text-light border-secondary" placeholder="e.g. admin or analyst" required autofocus>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label small text-muted text-uppercase fw-bold">Password</label>
      <div class="input-group">
        <span class="input-group-text bg-dark border-secondary text-muted">🔒</span>
        <input type="password" id="password" name="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••••••" required>
      </div>
    </div>

    <button type="submit" class="btn btn-info w-100 py-2 fw-bold text-dark mb-3">
      🚀 Authenticate &amp; Access SOC
    </button>
  </form>

  <!-- Quick Demo Fill Buttons -->
  <div class="p-3 bg-dark rounded border border-secondary small">
    <div class="text-muted fw-bold mb-2">⚡ Quick Access (Demo Profiles):</div>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-xs btn-outline-info flex-grow-1 py-1" onclick="quickFill('admin', 'minisoc@admin')">
        👑 Admin
      </button>
      <button type="button" class="btn btn-xs btn-outline-primary flex-grow-1 py-1" onclick="quickFill('analyst', 'minisoc@analyst')">
        🔍 Analyst
      </button>
      <button type="button" class="btn btn-xs btn-outline-warning flex-grow-1 py-1" onclick="quickFill('rites', 'password123')">
        🛡️ Ritesh
      </button>
    </div>
  </div>

  <div class="text-center text-muted small mt-4">
    Enterprise SIEM v2.2 &bull; AES Encrypted Session &bull; NIST SP 800-61
  </div>
</div>

<script>
function quickFill(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
}
</script>
</body>
</html>
