# MiniSOC Enterprise — Configuration Template
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored (never committed) to protect secrets.

# Flask session secret key — change this to a long random string in production
secret_key: "CHANGE_ME_use_a_long_random_string_here"

dashboard:
  host: "0.0.0.0"
  port: 5000
  debug: false          # set true only during local development

# Optional: Threat Intelligence API keys
# Leave blank to disable that feed (the SOC will still work without them)
threat_intel:
  virustotal_api_key: ""
  abuseipdb_api_key: ""
  threatfox_api_key: ""
  otx_api_key: ""

# Optional: Gemini AI key for Nova analyst
ai:
  gemini_api_key: ""
