name: MiniSOC CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: "Validate & Smoke Test"
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Install dependencies ──────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Syntax check all Python files ────────────────────────
      - name: Python syntax check
        run: |
          find . -name "*.py" -not -path "./venv/*" | while read f; do
            python -m py_compile "$f" && echo "  OK: $f"
          done

      # ── Database initialization ───────────────────────────────
      - name: Initialize database
        run: python -c "import sys, os; sys.path.insert(0, os.getcwd()); from database.models import init_db; init_db()"

      # ── Password hashing unit test ────────────────────────────
      - name: Test password hashing
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.getcwd())
          from database.models import hash_password, check_password

          # Correct password must pass
          h = hash_password('minisoc@admin')
          assert check_password('minisoc@admin', h), 'FAIL: correct password rejected'

          # Wrong password must fail
          assert not check_password('wrongpassword', h), 'FAIL: wrong password accepted'

          # Legacy plaintext migration — check_password accepts plaintext too
          assert check_password('plaintext', 'plaintext'), 'FAIL: plaintext migration check'

          # Hash is always 64 chars
          assert len(h) == 64, f'FAIL: unexpected hash length {len(h)}'

          print('[+] All password hashing tests passed.')
          "

      # ── Import check for all major modules ───────────────────
      - name: Import sanity check
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.getcwd())
          from database.models import get_conn, init_db, hash_password, check_password
          from network.ips_responder import block_ip, unblock_ip, list_blocked_ips
          print('[+] All module imports OK.')
          "

      # ── Flask route smoke test (test client — no port binding) ───
      - name: Flask route smoke test
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, os.getcwd())

          # Load app module
          import importlib.util
          spec = importlib.util.spec_from_file_location('app', 'dashboard/app.py')
          mod = importlib.util.module_from_spec(spec)
          sys.modules['app'] = mod
          spec.loader.exec_module(mod)

          app = mod.app
          app.config['TESTING'] = True

          with app.test_client() as client:
              # /health must return 200
              r = client.get('/health')
              assert r.status_code == 200, f'/health returned {r.status_code}'
              print('[+] /health -> 200 OK')

              # /login must return 200 (no session needed)
              r = client.get('/login')
              assert r.status_code == 200, f'/login returned {r.status_code}'
              print('[+] /login -> 200 OK')

              # /api/live/metrics must return 401 without a session
              r = client.get('/api/live/metrics')
              assert r.status_code == 401, f'/api/live/metrics returned {r.status_code} (expected 401)'
              import json
              data = json.loads(r.data)
              assert data.get('session_expired') == True, 'session_expired flag missing from 401 response'
              print('[+] /api/live/metrics -> 401 with session_expired flag (correct)')

              # Test login with valid credentials
              r = client.post('/login', data={'username': 'admin', 'password': 'minisoc@admin', 'next': '/'}, follow_redirects=False)
              assert r.status_code in (302, 200), f'login POST returned {r.status_code}'
              print(f'[+] POST /login (admin) -> {r.status_code} (redirect/success)')

              print()
              print('[+] All Flask route smoke tests passed.')
          "

